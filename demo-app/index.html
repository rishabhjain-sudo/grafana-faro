<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo Shop · Faro analytics POC</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Grafana Faro Web SDK 2.14.0 (Apache-2.0), vendored, so no CDN is needed -->
  <script src="vendor/faro-web-sdk-2.14.0.iife.js"></script>
  <!-- Faro session replay add-on 2.14.0 (Apache-2.0, rrweb-based), vendored -->
  <script src="vendor/faro-instrumentation-replay-2.14.0.iife.js"></script>
  <script src="config.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">☕ Demo Shop</a>
    <nav>
      <a href="#/">Shop</a>
      <a href="#/pricing">Pricing</a>
      <a href="#/cart" id="cart-link">Cart (0)</a>
    </nav>
    <div class="user">
      <span id="user-label"></span>
      <button id="signup-btn" class="ghost">Sign up</button>
    </div>
  </header>

  <main id="view"></main>

  <aside class="debug">
    <strong>Analytics POC</strong>
    <span>Every click here is sent to Grafana Faro → Alloy → Loki.</span>
    <button id="search-btn" class="ghost">Use search</button>
    <button id="wishlist-btn" class="ghost">Use wishlist</button>
    <button id="error-btn" class="danger">Trigger JS error</button>
    <button id="reset-btn" class="ghost">New visitor</button>
    <a href="http://localhost:3000" target="_blank" rel="noopener">Dashboard ↗</a>
    <a href="/insights/" target="_blank" rel="noopener">Insights (replays, funnels, retention, paths, heatmaps) ↗</a>
  </aside>

  <script src="app.js"></script>
</body>
</html>
