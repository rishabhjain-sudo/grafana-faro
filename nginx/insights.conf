# Insights app (port 3001, next to Grafana on 3000):
#   /                    replay, funnels, retention, paths, heatmaps
#   /shop/               read-only copy of the demo shop, used as the heatmap
#                        preview (must be same-origin so clicks can be mapped
#                        onto the page's elements; loaded with ?embed=1, so no tracking)
#   /loki/api/v1/query*  READ-ONLY proxy to Loki (GET only)
server {
    listen 80;
    server_name _;
    root /usr/share/insights;
    index index.html;

    location /shop/ {
        alias /usr/share/shop/;
        index index.html;
    }

    location ~ ^/loki/api/v1/(query|query_range|labels|label/[^/]+/values|series)$ {
        limit_except GET { deny all; }
        proxy_pass http://loki:3100;
        proxy_read_timeout 120s;
    }
    location /loki/ { return 403; }

    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;
}
