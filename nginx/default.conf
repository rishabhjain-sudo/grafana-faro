# Demo shop + Insights app, plus a READ-ONLY proxy to Loki's query API so the
# Insights pages (same origin) can run LogQL from the browser.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /insights/ {
        alias /usr/share/insights/;
        index index.html;
    }

    # Only GET query endpoints: no push, no delete, no admin.
    location ~ ^/loki/api/v1/(query|query_range|labels|label/[^/]+/values|series)$ {
        limit_except GET { deny all; }
        proxy_pass http://loki:3100;
        proxy_read_timeout 120s;
    }
    location /loki/ { return 403; }

    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;
}
