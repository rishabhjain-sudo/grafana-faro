# Single-binary Loki for the POC (filesystem storage, 7-day retention).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h               # 30 days
  allow_structured_metadata: true
  # The traffic generator back-fills 14 days of history (for retention cohorts).
  reject_old_samples: true
  reject_old_samples_max_age: 336h
  # Session replay events (rrweb DOM snapshots) can be large single lines.
  max_line_size: 4MB
  max_line_size_truncate: false
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 64
  per_stream_rate_limit: 32MB
  per_stream_rate_limit_burst: 64MB
  # Insights pages run per-user / per-session queries.
  max_query_series: 200000
  max_entries_limit_per_query: 20000
  max_query_length: 721h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
